name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
        arch:
          - x64
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create database and user
        env:
          PGPASSWORD: postgres_password
        run: |
          psql -h localhost -U postgres -d postgres -c "
            CREATE USER himynamejeff WITH PASSWORD 'qwerty12345';
          " || true

          psql -h localhost -U postgres -d postgres -c "
            ALTER USER himynamejeff CREATEDB;
          "

          psql -h localhost -U postgres -d postgres -c "
            CREATE DATABASE gbdb OWNER himynamejeff;
          " || true
      - name: Create .env
        run: |
          cat > .env << EOF
          DB_USER=himynamejeff
          DB_PASSWORD=qwerty12345
          DB_NAME=gbdb
          DB_HOST=localhost
          EOF
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      # - name: Run doctests
      #   shell: julia --project=docs --color=yes {0}
      #   run: |
      #     using Documenter: DocMeta, doctest
      #     using GenomicBreedingDB
      #     DocMeta.setdocmeta!(GenomicBreedingDB, :DocTestSetup, :(using GenomicBreedingDB); recursive=true)
      #     doctest(GenomicBreedingDB)
